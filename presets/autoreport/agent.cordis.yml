# AutoReport Main: a fixed physics-report coordinator preset.
# Absolute plugin paths and persona text are rendered by install-user-preset.ts.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |
      __AUTOREPORT_MAIN_PERSONA__

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Filesystem reads and Main's Outline writes; AutoReport guards enforce scope.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  config:
    enableRunInBackground: false

# Generic DSH/user/project skills stay available in this preset. AutoReport's
# bundled skills and domain tools join through the single `autoreport` row below.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# Local compaction survives because workflow state is log-only and durable.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# One preset-plane AutoReport contribution: scoped bundled skills plus the
# current fixed-workflow MAIN tools. No generic subagent/workflow/ralph tools.
- id: autoreport
  name: '__AUTOREPORT_PRESET__'

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
