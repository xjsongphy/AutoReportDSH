# AutoReportDSH's installable DSH bundle. DSH applies this layer through the
# profile mechanism; users do not need to pass a generated --patch overlay.

# AutoReport's router installs report_workflow for role-bound AutoReport
# subagents; ordinary children keep the stock adjacent-agent messaging the
# base bundle mounts (the standalone stock report tool was removed upstream).
- insert:
    - id: autoreport-host
      name: dsh-autoreport
    - id: autoreport-report-router
      name: dsh-autoreport/tools/report-router
