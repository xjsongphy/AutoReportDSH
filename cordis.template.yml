# AutoReportDSH patch-overlay over a stock dsh profile.
#
# install-user-preset.ts renders cordis.overlay.generated.yml from this file,
# replacing __AUTOREPORT_REPORT_ROUTER__ with the absolute built child-report
# router. The host row is the package name `autoreportdsh` so DSH's client
# module scan can resolve package.json (`dsh.client` + exports["./client"]).
# The installer also symlinks this package under
# `$DSH_HOME/profiles/node_modules/autoreportdsh`. Usage after rendering:
#
#   pnpm dsh web --patch ./cordis.overlay.generated.yml
#
# One router installs report_workflow only for pre-bound AutoReport subagents;
# ordinary children keep the stock adjacent-agent messaging the base bundle
# mounts (the standalone stock report tool was removed upstream).
- insert:
    - id: autoreportdsh-host
      name: autoreportdsh
    - id: autoreportdsh-report-router
      name: '__AUTOREPORT_REPORT_ROUTER__'
