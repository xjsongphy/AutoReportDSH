# AutoReportDSH patch-overlay over a stock dsh profile.
#
# install-user-preset.ts renders cordis.overlay.generated.yml from this file,
# replacing the __AUTOREPORT_ENTRY__ token in the row below with the absolute
# built host entry (dist/src/host.js) and __AUTOREPORT_REPORT_ROUTER__ with the
# global child-report router. Usage after rendering and installing:
#
#   pnpm dsh web --patch ./cordis.overlay.generated.yml
#
# The stock child-report setup is global. Replace it with one router that
# preserves stock reporting for ordinary children and installs report_workflow
# only for pre-bound AutoReport specialists.
- id: tool-subagent-report
  disabled: true

- insert:
    - id: autoreportdsh-host
      name: '__AUTOREPORT_ENTRY__'
    - id: autoreportdsh-report-router
      name: '__AUTOREPORT_REPORT_ROUTER__'
