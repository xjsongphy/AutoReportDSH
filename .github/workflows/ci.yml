name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.19.0'
  DSH_REF: '429220f41e6362a0674d21b4d7dfe94cfaa59c8d'

defaults:
  run:
    working-directory: AutoReportDSH

jobs:
  verify:
    name: ${{ matrix.name }} / locked Harness / test + build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      # The plugin's package.json intentionally uses sibling link: dependencies.
      # Check both repositories out under GITHUB_WORKSPACE so ../deepseek-harness
      # resolves exactly as it does in the documented source-install workflow.
      - name: Check out AutoReportDSH
        uses: actions/checkout@v6
        with:
          path: AutoReportDSH
          persist-credentials: false

      - name: Check out the pinned DeepSeek Harness
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: deepseek-harness
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            AutoReportDSH/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install and build the pinned Harness
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Run keyless test suite
        run: pnpm test

      - name: Type-check and build plugin
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Verify generated artifacts do not dirty tracked files
        run: git diff --exit-code -- .
