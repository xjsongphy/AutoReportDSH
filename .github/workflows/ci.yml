name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.19.0'
  # Upstream base the plugin targets: dsh-v0.1.6-alpha.1 (docs/dependencies.md).
  # The pinned development checkout additionally carries one upstream-candidate
  # commit (Session.append { ignorable: true }) that is not on the public base
  # yet; CI runs the stock base, where the in-process vocabulary registration
  # carries log loadability and the marker probe degrades gracefully.
  DSH_REF: '0d1f50007f9bca3f52b06e1c3074fa14d5fb0720'

defaults:
  run:
    working-directory: AutoReportDSH

jobs:
  verify:
    name: ${{ matrix.name }} / locked Harness / test + build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      # The plugin's package.json intentionally uses sibling link: dependencies.
      # Check both repositories out under GITHUB_WORKSPACE so ../deepseek-harness
      # resolves exactly as it does in the documented source-install workflow.
      - name: Check out AutoReportDSH
        uses: actions/checkout@v6
        with:
          path: AutoReportDSH
          persist-credentials: false

      - name: Check out the pinned DeepSeek Harness
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.DSH_REF }}
          path: deepseek-harness
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            AutoReportDSH/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      # Live bash confinement tests need an OS sandbox. ubuntu-latest does not
      # ship bubblewrap; without it the suite would skip the P0 write-denial
      # cases. Ubuntu 24.04 also gates unprivileged user namespaces behind
      # AppArmor — lift that or `bwrap` cannot confine. macOS runners already
      # have sandbox-exec.
      - name: Install Linux bubblewrap
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo 'apparmor userns knob absent — the functional probe decides'

      - name: Install and build the pinned Harness
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      # Installer tests and boot smokes require dist/. Build before the suite
      # so a clean CI checkout does not depend on test-order side effects.
      - name: Type-check and build plugin
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Run keyless test suite
        run: pnpm test

      - name: Verify generated artifacts do not dirty tracked files
        run: git diff --exit-code -- .
