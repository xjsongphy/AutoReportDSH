# Scheduled compatibility probe for the supported Harness version. A manual
# run can select another tag or commit to check a candidate before retargeting.

name: Canary

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: DeepSeek Harness tag or commit to verify
        required: false
        default: '6b1808f432adfa96ab6c2f033e158ca230422e16'
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22.19.0'
  DSH_REF: '6b1808f432adfa96ab6c2f033e158ca230422e16'

defaults:
  run:
    working-directory: AutoReportDSH

jobs:
  harness-compatibility:
    name: supported Harness compatibility probe
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out AutoReportDSH
        uses: actions/checkout@v6
        with:
          path: AutoReportDSH
          persist-credentials: false

      - name: Check out Harness ref ${{ inputs.dsh_ref || env.DSH_REF }}
        uses: actions/checkout@v6
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ inputs.dsh_ref || env.DSH_REF }}
          path: deepseek-harness
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            AutoReportDSH/pnpm-lock.yaml
            deepseek-harness/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      # The live bash-confinement tests gate on a working OS sandbox (same as
      # ci.yml): ubuntu-latest ships no bubblewrap, and AppArmor gates
      # unprivileged user namespaces behind a sysctl.
      - name: Install Linux bubblewrap
        working-directory: ${{ github.workspace }}
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 \
            || echo 'apparmor userns knob absent — the functional probe decides'

      - name: Install and build the harness
        working-directory: deepseek-harness
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and build plugin
        run: |
          pnpm run typecheck
          pnpm run build

      - name: Run test suite against selected Harness ref
        run: pnpm test
